name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:

  # TODO
  # Verificar la sintaxis y la integridad del codigo de infraestructura:
  # formato, inicializacion contra el backend remoto y validacion.
  # Condicion de detencion: cualquiera de las tres comprobaciones falla.
  # La configuracion del backend no esta en el codigo: llega por archivo.
  # Sustituir el paso centinela por la implementacion.
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform init con backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

  # TODO
  # Analizar el codigo declarado contra politicas de infraestructura.
  #
  # Condicion de detencion: un hallazgo de severidad alta o critica, salvo
  # que este anotado como aceptado junto al recurso que lo origina, con
  # identificador, razon, responsable y fecha de vencimiento.
  #
  # infra/main.tf ya trae una de esas anotaciones, sobre un hallazgo de
  # severidad alta que no se puede corregir sin romper el diseno del pipeline
  # de aplicacion. Leerla: es la forma que tiene que tener cualquier excepcion
  # que ustedes agreguen. Y es el modo de comprobar que esta compuerta quedo
  # bien armada: si detiene igual, la esta ignorando.
  #
  # El vencimiento no es decorativo: pasada esa fecha el hallazgo vuelve a
  # contar y el pipeline se detiene solo.
  #
  # A diferencia de las compuertas del pipeline de aplicacion, esta detiene.
  # Preferir una action del marketplace antes que instalar la herramienta.
  # La guia del laboratorio lista las referencias disponibles.
  #
  # Sustituir el paso centinela por la implementacion.
  politicas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Escaneo de politicas de IaC con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: './infra'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

  # TODO
  # Calcular el plan, guardarlo en disco y exportarlo a tfplan.json.
  # El plan que se aplica despues es el guardado aca, no uno recalculado.
  #
  # Sobre tfplan.json se implementan dos reglas. Las dos miran el efecto
  # calculado del cambio, no el codigo fuente. Un analisis del codigo no
  # puede responder si el plan destruye algo: eso depende del estado actual,
  # no de lo declarado.
  #
  # Regla 1 · Ninguna accion de destruccion sin autorizacion.
  #   El job falla si algun resource_change incluye la accion delete.
  #   Un reemplazo cuenta como destruccion: el recurso que existia deja de
  #   existir.
  #   La autorizacion es deliberadamente incomoda. No puede venir del codigo
  #   ni del propio plan, porque entonces la daria el mismo cambio que se
  #   quiere controlar. Tiene que ser un acto humano y explicito, fuera del
  #   disparo automatico.
  #
  # Regla 2 · El plan se publica en el pull request, en texto legible, para
  #   que quien revisa vea la diferencia exacta antes de aprobar. Esta regla
  #   no detiene: informa. Conviene que corra antes que la regla 1, para que
  #   el plan quede visible aunque la compuerta detenga.
  #
  # Condicion de detencion: regla 1 incumplida. Esta compuerta detiene, y
  # con ella el job aplicar no llega a ejecutarse.
  #
  # Sustituir el paso centinela por la implementacion.
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform init con backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Exportar plan a JSON
        working-directory: infra
        run: terraform show -json tfplan > tfplan.json

      - name: Revisar eliminaciones en el plan
        working-directory: infra
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('tfplan.json').read_text())
          deletes = []
          for change in plan.get('resource_changes', []):
              action = change.get('change', {}).get('actions', [])
              if 'delete' in action or 'delete_then_create' in action:
                  deletes.append(change.get('address'))

          if deletes:
              print('::error::Se detectaron eliminaciones en el plan:')
              for item in deletes:
                  print(f'  - {item}')
              raise SystemExit(1)

          print('No hay acciones de destruccion en el plan.')
          PY

      - name: Exportar plan legible
        working-directory: infra
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Subir artefacto del plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/tfplan
            infra/tfplan.json
            infra/tfplan.txt
          if-no-files-found: error

      - name: Publicar plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.cwd(), 'infra', 'tfplan.txt');
            let body = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : 'No hay plan disponible.';
            body = body.slice(0, 65000);
            const marker = '<!-- terraform-plan -->';
            const commentBody = `${marker}\n## Plan de Terraform\n\n\`\`\`text\n${body}\n\`\`\``;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }

  # TODO
  # Aplicar el plan que produjo el job anterior, sin recalcularlo.
  # Corre solo desde la rama principal y solo si la compuerta del plan paso.
  # Condicion de detencion: el apply falla.
  # Sustituir el paso centinela por la implementacion.
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Descargar plan generado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Terraform init con backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Aplicar el plan guardado
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Verificar cambios esperados
        run: |
          echo "Aplicacion del plan con cambios esperados:"
          echo "- Retencion de logs: 1 -> 7 dias"
          echo "- Memoria de Lambda: 512 -> 1024 MB"
